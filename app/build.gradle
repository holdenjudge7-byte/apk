plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.orsted.chessoverlay'
    compileSdk 34

    // NDK r21e — last version with stable armeabi-v7a support
    ndkVersion "21.4.7075529"

    defaultConfig {
        applicationId "com.orsted.chessoverlay"
        minSdk 26          // API 26 = Android 8.0; Oppo A5s ships 8.1 (API 27)
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            // armeabi-v7a = 32-bit ARM (Oppo A5s, most budget phones)
            // arm64-v8a   = 64-bit ARM (keep for newer devices)
            abiFilters "armeabi-v7a", "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                // c++14 required by SF11; c++_static avoids .so runtime dependency
                cppFlags "-std=c++14 -O2 -DNDEBUG"
                arguments "-DANDROID_STL=c++_static",
                          "-DANDROID_PLATFORM=android-26"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with debug key so the APK is immediately installable
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
}
