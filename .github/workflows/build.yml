name: Build Orsted Chess Overlay (SF11 / 32-bit)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android NDK r21e
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
          add-to-path: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Download gradle-wrapper.jar — this is a binary file you cannot paste
      # into GitHub on a phone, so the workflow downloads it automatically.
      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -L "https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Download Stockfish 11 source
      - name: Download Stockfish 11 source
        run: |
          curl -L https://github.com/official-stockfish/Stockfish/archive/refs/tags/sf_11.tar.gz \
            -o sf11.tar.gz
          tar -xzf sf11.tar.gz
          mkdir -p app/src/main/cpp/stockfish
          find Stockfish-sf_11/src -maxdepth 1 -name '*.cpp' ! -name 'main.cpp' \
            -exec cp {} app/src/main/cpp/stockfish/ \;
          find Stockfish-sf_11/src -maxdepth 1 -name '*.h' \
            -exec cp {} app/src/main/cpp/stockfish/ \;
          mkdir -p app/src/main/cpp/stockfish/syzygy
          find Stockfish-sf_11/src/syzygy \( -name '*.cpp' -o -name '*.h' \) \
            -exec cp {} app/src/main/cpp/stockfish/syzygy/ \;
          echo "SF11 staged:"
          ls app/src/main/cpp/stockfish/

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orsted-chess-sf11-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
